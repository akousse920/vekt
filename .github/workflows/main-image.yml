name: Main Image

# Builds the production image on every push to main so the server only has to
# pull it (the Next.js build needs more memory than the VPS can spare).
# Tags: ghcr.io/<owner>/<repo>:main and :sha-<short sha>. `latest` stays
# reserved for releases (see docker-image.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set image name to lower-case
        id: image_name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=main-amd64

  deploy:
    name: Deploy to Kousse
    needs: build
    if: github.repository == 'akousse920/vekt'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
      - name: Update the application
        env:
          SSH_KEY: ${{ secrets.KOUSSE_DEPLOY_KEY }}
          SSH_TARGET: ${{ vars.KOUSSE_SSH_TARGET }}
          KNOWN_HOSTS: ${{ vars.KOUSSE_KNOWN_HOSTS }}
        run: |
          umask 077
          key="$RUNNER_TEMP/kousse_key"
          hosts="$RUNNER_TEMP/kousse_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 "$SSH_TARGET" "$GITHUB_SHA"

      - name: Verify public availability
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 10 --retry-all-errors --retry-delay 3 --max-time 10 \
            https://recrutement.kdevs.space/login
